# EKS only: makes gp3 (EBS CSI driver) the default StorageClass so mongo-pvc gets a volume.
# Apply before the k8s/ manifests: kubectl apply -f eks/storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
